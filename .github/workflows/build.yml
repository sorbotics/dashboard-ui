name: Build Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    name: Prepare build variables
    runs-on: ubuntu-22.04

    outputs:
      tag: ${{ steps.build-vars.outputs.tag }}
      version: ${{ steps.build-vars.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: build-vars
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '\r\n' < version.txt)"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            TAG="v${FILE_VERSION}"
            VERSION="$FILE_VERSION"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-deb-amd64:
    name: Build Debian package (amd64)
    needs: prepare
    runs-on: ubuntu-22.04

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ needs.prepare.outputs.tag }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      TARGET_ARCH: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq git curl

      - name: Validate required files
        run: |
          set -e
          test -f deb_build.sh
          test -f version.txt
          test -d package/DEBIAN
          test -d package/files

      - name: Ensure build script is executable
        run: chmod +x deb_build.sh

      - name: Build Debian package
        run: ./deb_build.sh

      - name: List generated packages
        run: ls -lah *.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-deb-amd64
          path: "*.deb"
          if-no-files-found: error

  build-deb-arm64:
    name: Build Debian package (arm64)
    needs: prepare
    runs-on: ubuntu-22.04-arm

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ needs.prepare.outputs.tag }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      TARGET_ARCH: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Debian packaging tools
        run: |
          test "$(uname -m)" = "aarch64"
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq git curl

      - name: Validate required files
        run: |
          set -e
          test -f deb_build.sh
          test -f version.txt
          test -d package/DEBIAN
          test -d package/files

      - name: Ensure build script is executable
        run: chmod +x deb_build.sh

      - name: Build Debian package
        run: ./deb_build.sh

      - name: List generated packages
        run: |
          ls -lah *.deb
          test "$(dpkg-deb --field ./*.deb Architecture)" = "arm64"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-deb-arm64
          path: "*.deb"
          if-no-files-found: error

  build-rpm:
    needs: prepare
    runs-on: ubuntu-22.04

    container:
      image: registry.access.redhat.com/ubi9/nodejs-18:latest
      options: --user 0

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ needs.prepare.outputs.tag }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      HOME: /github/home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          yum --disableplugin=subscription-manager install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm \
            && yum update -y \
            && yum --disableplugin=subscription-manager install -y openssh-clients rpmlint rpm-build dpkg fakeroot jq

      - name: Validate required files
        run: |
          set -eux
          test -f rpm_build.sh
          test -f version.txt
          test -d 8.4.3
          test -d package/RPMBUILD
          test -d package/files
          test -f package/RPMBUILD/SPECS/sorba-dashboard-ui.spec

      - name: Make build script executable
        run: chmod +x rpm_build.sh

      - name: Build RPM package
        run: |
          set -euxo pipefail
          ./rpm_build.sh

      - name: List generated RPMs
        run: ls -lah *.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-rpm-package
          path: "*.rpm"
          if-no-files-found: error

  docker-build:
    needs: prepare
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      REGISTRY: ${{ secrets.ACR_REGISTRY_NAME }}.azurecr.io
      IMAGE_NAME: sorbotics/dashboard/dashboard-ui/main
      DOCKER_CONTEXT_DIR: .
      DOCKERFILE_NAME: Dockerfile
      DOCKER_BUILD_SUMMARY: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Define image repository
        id: image
        shell: bash
        run: |
          IMAGE_REPO="${REGISTRY}/${IMAGE_NAME}"
          echo "repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_TOKEN_NAME }}
          password: ${{ secrets.ACR_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' }}
          labels: |
            org.opencontainers.image.vendor=SORBOTICS
            org.opencontainers.image.authors=SORBOTICS <support@sorba.ai>
            org.opencontainers.image.url=https://www.sorbotics.com
            org.opencontainers.image.documentation=https://www.sorbotics.com
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT_DIR }}
          file: ${{ env.DOCKER_CONTEXT_DIR }}/${{ env.DOCKERFILE_NAME }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Show published tags
        shell: bash
        run: |
          echo "Published images:"
          echo "${{ steps.meta.outputs.tags }}"

  release:
    runs-on: ubuntu-22.04
    needs: [prepare, build-deb-amd64, build-deb-arm64, build-rpm]

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dashboard-*
          merge-multiple: true

      - name: Generate global checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f \( -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Prepare release variables
        id: relvars
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/checksums.txt
          generate_release_notes: false
          body: |
            ## Packages

            This release includes:
            - Debian packages for `amd64` and `arm64` (`.deb`)
            - RPM package (`.rpm`)
            - `checksums.txt` with SHA256 hashes

            ### Install on Debian/Ubuntu
            ```bash
            VERSION="${{ steps.relvars.outputs.version }}"
            curl -fL -o /tmp/sorba-dashboard-ui_${VERSION}_amd64.deb https://github.com/${{ github.repository }}/releases/download/${{ steps.relvars.outputs.tag }}/sorba-dashboard-ui_${VERSION}_amd64.deb
            sudo apt install -y /tmp/sorba-dashboard-ui_${VERSION}_amd64.deb
            ```

            For ARM64, replace `amd64` with `arm64` in the package name and URL.

            ### Install on RHEL9
            ```bash
            VERSION="${{ steps.relvars.outputs.version }}"
            curl -fL -o /tmp/sorba-dashboard-ui-${VERSION}.rpm https://github.com/${{ github.repository }}/releases/download/${{ steps.relvars.outputs.tag }}/sorba-dashboard-ui-${VERSION}.el9.x86_64.rpm
            sudo dnf install -y /tmp/sorba-dashboard-ui-${VERSION}.rpm
            ```

            ### Verify integrity
            ```bash
            curl -fL -O https://github.com/${{ github.repository }}/releases/download/${{ steps.relvars.outputs.tag }}/checksums.txt
            sha256sum -c checksums.txt
            ```
