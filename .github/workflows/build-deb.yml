name: Build Debian Packages

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare build variables
    runs-on: ubuntu-22.04

    outputs:
      tag: ${{ steps.build-vars.outputs.tag }}
      version: ${{ steps.build-vars.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve default tag and version
        id: build-vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < version.txt)"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-deb-amd64:
    name: Build Debian package (amd64)
    needs: prepare
    runs-on: ubuntu-22.04

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ needs.prepare.outputs.tag }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      TARGET_ARCH: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq git curl

      - name: Validate required files
        run: |
          set -e
          test -f deb_build.sh
          test -f version.txt
          test -d package/DEBIAN
          test -d package/files

      - name: Ensure build script is executable
        run: chmod +x deb_build.sh

      - name: Build Debian package
        run: ./deb_build.sh

      - name: Validate generated package
        run: |
          ls -lah *.deb
          test "$(dpkg-deb --field ./*.deb Architecture)" = "amd64"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-deb-amd64
          path: "*.deb"
          if-no-files-found: error

  build-deb-arm64:
    name: Build Debian package (arm64)
    needs: prepare
    runs-on: ubuntu-22.04-arm

    env:
      CI: "true"
      CI_PROJECT_DIR: ${{ github.workspace }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ needs.prepare.outputs.tag }}
      CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CI_PROJECT_NAME: ${{ github.event.repository.name }}
      CI_PROJECT_PATH: ${{ github.repository }}
      CI_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      TARGET_ARCH: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Debian packaging tools
        run: |
          test "$(uname -m)" = "aarch64"
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot jq git curl

      - name: Validate required files
        run: |
          set -e
          test -f deb_build.sh
          test -f version.txt
          test -d package/DEBIAN
          test -d package/files

      - name: Ensure build script is executable
        run: chmod +x deb_build.sh

      - name: Build Debian package
        run: ./deb_build.sh

      - name: Validate generated package
        run: |
          ls -lah *.deb
          test "$(dpkg-deb --field ./*.deb Architecture)" = "arm64"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-deb-arm64
          path: "*.deb"
          if-no-files-found: error
